<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오예찬 · 차세대지능형반도체 수강 계획</title>
<meta name="description" content="오예찬의 개인 사이트 · 차세대지능형반도체전공 수강 계획기">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --paper: #F4F6F8;
    --panel: #FFFFFF;
    --ink: #1E2430;
    --muted: #5B6472;
    --line: #D5DAE1;
    --ch1: #E3B505;
    --ch2: #0F7F96;
    --ch3: #B8327E;
    --font: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #12161C;
      --panel: #1A2029;
      --ink: #E7EAEE;
      --muted: #9AA3B0;
      --line: #2E3641;
      --ch2: #3FC1D9;
      --ch3: #E06AAE;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.65; word-break: keep-all; }
  a { color: var(--ch2); }
  :focus-visible { outline: 3px solid var(--ch2); outline-offset: 2px; border-radius: 4px; }
  .wrap { max-width: 1040px; margin: 0 auto; padding-inline: 24px; }

  header.intro { padding-block: 72px 40px; }
  .name { font-size: clamp(56px, 11vw, 112px); font-weight: 800; letter-spacing: -0.045em; line-height: 0.95; margin: 0; }
  .trace-line { display: block; width: min(420px, 80%); height: 28px; margin: 18px 0 20px; }

  section { padding-block: 48px; border-top: 1px solid var(--line); }
  h2 { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 8px; }
  .sub { color: var(--muted); margin: 0 0 24px; max-width: 42em; }

  .console { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 22px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
  .toolbar button, .toolbar select {
    font: inherit; font-size: 15px; font-weight: 600; padding: 8px 15px; border-radius: 999px; cursor: pointer;
    border: 1.5px solid var(--ink); background: transparent; color: var(--ink);
  }
  .toolbar .primary { background: var(--ink); color: var(--paper); }
  .toolbar label { font-size: 14px; color: var(--muted); margin-left: 6px; }
  .legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 13px; color: var(--muted); margin: 0 0 14px; }
  .legend i { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-right: 5px; }
  .legend .l-done { background: var(--ch1); }
  .legend .l-avail { border: 2px solid var(--ch2); }
  .legend .l-lock { border: 1.5px dashed var(--muted); }

  .board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
  .col h3 { font-size: 15px; font-weight: 700; margin: 0 0 10px; }
  .col h3 span { font-weight: 400; color: var(--muted); font-size: 13px; }
  .course {
    display: block; width: 100%; text-align: left; font: inherit; font-size: 14.5px; line-height: 1.35;
    padding: 9px 11px; margin-bottom: 8px; border-radius: 10px; cursor: pointer;
    border: 1.5px dashed var(--line); background: transparent; color: var(--muted);
  }
  .course.available { border: 2px solid var(--ch2); color: var(--ink); background: var(--panel); }
  .course.done { background: var(--ch1); border: 2px solid var(--ch1); color: #1E2430; }
  .course .req { display: inline-block; font-size: 11.5px; font-weight: 700; color: var(--ch3); margin-left: 4px; }
  .course.done .req { color: #6B1747; }
  .info { min-height: 3.3em; font-size: 14.5px; margin: 6px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--paper); }
  .info b { font-weight: 700; }

  .plan { margin-top: 22px; border-top: 1px dashed var(--line); padding-top: 16px; }
  .plan-stat { font-size: 14px; color: var(--muted); margin: 0 0 14px; }
  .plan-stat b { color: var(--ink); }
  .term { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 10px; align-items: start; margin-bottom: 14px; }
  .term-label { font-size: 14px; font-weight: 700; color: var(--ch2); padding-top: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 13.5px; padding: 4px 10px; border-radius: 7px; background: color-mix(in srgb, var(--ch2) 12%, transparent); }
  .chip.req { background: color-mix(in srgb, var(--ch3) 14%, transparent); }
  .queue { font-size: 12.5px; color: var(--muted); margin: 5px 0 0; }
  .empty { color: var(--muted); font-size: 15px; margin: 0; }
  @media (prefers-reduced-motion: no-preference) {
    .term.appear { animation: drop 260ms ease-out both; }
    @keyframes drop { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  }





  @media (max-width: 820px) { .board { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 640px) {
    header.intro { padding-block-start: 48px; }
    .console { padding: 16px; }
    .term { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  }
  @media (max-width: 430px) { .board { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<header class="intro wrap">
  <h1 class="name">오예찬</h1>
  <svg class="trace-line" viewBox="0 0 420 28" aria-hidden="true">
    <polyline points="0,20 40,20 40,6 80,6 80,20 120,20 120,6 160,6 160,20 200,20 200,6 240,6 240,20 420,20" fill="none" stroke="#E3B505" stroke-width="3" stroke-linejoin="round"/>
  </svg>
</header>

<main>
  <section class="wrap" id="planner" aria-labelledby="planner-title">
    <h2 id="planner-title">차세대지능형반도체 수강 계획기</h2>

    <div class="console">
      <div class="toolbar">
        <button type="button" id="mine">제 수강 과목 불러오기</button>
        <button type="button" id="clear">모두 지우기</button>
        <label for="cap">학기당 최대</label>
        <select id="cap">
          <option value="3">3과목</option>
          <option value="4" selected>4과목</option>
          <option value="5">5과목</option>
          <option value="6">6과목</option>
        </select>
        <button type="button" class="primary" id="make">수강 순서 만들기</button>
      </div>
      <p class="legend">
        <span><i class="l-done"></i>들은 과목</span>
        <span><i class="l-avail"></i>지금 들을 수 있음</span>
        <span><i class="l-lock"></i>선행 과목이 남음</span>
        <span><b style="color:var(--ch3)">전필</b> 전공필수</span>
      </p>
      <div class="board" id="board"></div>
      <p class="info" id="info" aria-live="polite">과목에 마우스를 올리거나 포커스하면 먼저 들으면 좋은 과목이 보여요.</p>
      <div class="plan" id="plan" aria-live="polite">
        <p class="empty">‘수강 순서 만들기’를 누르면 남은 과목이 학기별로 배치돼요.</p>
      </div>
    </div>
  </section>



</main>


<script>
// 차세대지능형반도체전공 과목 (첨단융합학부 전공 교과과정 2026.6 기준)
// year: 권장 학년, req: 전공필수, group: 화면에서 놓일 열
const COURSES = [
  { id: "lin",    name: "선형대수학",               group: "base", year: 1 },
  { id: "circ",   name: "기초회로 이론 및 실습",      group: "base", year: 1 },
  { id: "dsa",    name: "자료구조와 알고리즘",        group: "base", year: 1 },
  { id: "pchem",  name: "물리화학의 기초",            group: "base", year: 1 },
  { id: "cryst",  name: "결정학 기초",               group: "y2", year: 2 },
  { id: "em",     name: "기초전자기학",              group: "y2", year: 2 },
  { id: "logic",  name: "논리설계 및 실험",           group: "y2", year: 2, req: true },
  { id: "ec",     name: "기초전자회로 및 실습",       group: "y3", year: 3, req: true },
  { id: "pdm",    name: "프로그래밍 개발 방법론",     group: "y3", year: 3, req: true },
  { id: "dev",    name: "반도체 전자 소자",           group: "y3", year: 3, req: true },
  { id: "dsd",    name: "디지털 시스템 설계 및 실습", group: "y3", year: 3 },
  { id: "co",     name: "컴퓨터조직론",              group: "y3", year: 3 },
  { id: "sysw",   name: "시스템 소프트웨어",          group: "y3", year: 3 },
  { id: "qp",     name: "양자물리",                  group: "y3", year: 3 },
  { id: "sphys",  name: "첨단반도체물리",             group: "y3", year: 3 },
  { id: "analog", name: "아날로그 반도체 전자회로",   group: "y3", year: 3 },
  { id: "res",    name: "반도체공학 연구의 실습",     group: "y3", year: 3 },
  { id: "oimc",   name: "유무기재료화학",             group: "y4", year: 4 },
  { id: "icp",    name: "반도체집적공정",             group: "y4", year: 4 },
  { id: "ml",     name: "기계학습과 딥러닝",          group: "y4", year: 4 },
  { id: "mat",    name: "반도체 소재 및 공정",        group: "y4", year: 4 },
  { id: "mem",    name: "메모리 및 인공지능소자",     group: "y4", year: 4 },
  { id: "dic",    name: "디지털집적회로",             group: "y4", year: 4 },
  { id: "dla",    name: "딥러닝 가속기설계",          group: "y4", year: 4 },
  { id: "proj",   name: "반도체종합프로젝트",         group: "y4", year: 4 }
];

// 권장 선행 관계 [먼저 들을 과목, 나중 과목]
// 컴퓨터조직론 ← 디지털 시스템 설계는 과목 개요에 근거가 있고, 나머지는 과목 내용과 권장 학년으로 정리했어요.
const PREREQS = [
  ["lin", "ml"], ["circ", "ec"], ["dsa", "pdm"], ["pchem", "oimc"],
  ["logic", "dsd"], ["dsd", "co"], ["co", "sysw"], ["ec", "analog"],
  ["qp", "sphys"], ["cryst", "sphys"], ["em", "sphys"], ["sphys", "dev"],
  ["dev", "mem"], ["dev", "icp"], ["cryst", "mat"], ["dev", "dic"], ["dsd", "dic"],
  ["ml", "dla"], ["co", "dla"], ["dic", "proj"], ["icp", "proj"]
];

// 이번 학기(2026-2)에 듣고 있는 과목: 본인 상황에 맞게 고쳐 쓰세요.
const MY_COURSES = ["cryst", "logic", "dsa"];


const byId = new Map(COURSES.map(c => [c.id, c]));
const prereqOf = id => PREREQS.filter(([, b]) => b === id).map(([a]) => a);

function availableNow(done) {
  return COURSES.filter(c => !done.has(c.id) && prereqOf(c.id).every(p => done.has(p))).map(c => c.id);
}

// 이 과목 뒤로 이어지는 가장 긴 선행 사슬의 길이 (메모이제이션 DFS)
const chainMemo = new Map();
function chainLength(id) {
  if (chainMemo.has(id)) return chainMemo.get(id);
  const after = PREREQS.filter(([a]) => a === id).map(([, b]) => b);
  const len = 1 + Math.max(0, ...after.map(chainLength));
  chainMemo.set(id, len);
  return len;
}

function byPriority(a, b) {
  const x = byId.get(a), y = byId.get(b);
  return (chainLength(b) - chainLength(a))            // 뒤로 이어지는 사슬이 긴 과목 먼저
    || (x.year - y.year)                               // 권장 학년이 이른 과목 먼저
    || ((y.req ? 1 : 0) - (x.req ? 1 : 0))             // 전공필수 먼저
    || x.name.localeCompare(y.name, "ko");
}

function planSemesters(courses, prereqs, done, cap) {
  // 1) 남은 과목만으로 그래프를 만들고 진입 차수(아직 안 들은 선행 과목 수)를 센다
  const indeg = new Map(), next = new Map();
  for (const c of courses) if (!done.has(c.id)) { indeg.set(c.id, 0); next.set(c.id, []); }
  let edges = 0;
  for (const [a, b] of prereqs) {
    if (!indeg.has(a) || !indeg.has(b)) continue;   // 이미 들은 선행 과목은 조건 충족
    indeg.set(b, indeg.get(b) + 1);
    next.get(a).push(b);
    edges++;
  }
  // 2) 진입 차수 0인 과목으로 큐를 시작한다
  let queue = [...indeg.keys()].filter(id => indeg.get(id) === 0);
  const terms = [];
  while (queue.length > 0) {
    queue.sort(byPriority);                         // 선행 사슬이 길수록, 학년이 이를수록, 전공필수일수록 먼저
    const term = queue.slice(0, cap);               // 이번 학기에 들을 과목
    const waiting = queue.slice(cap);               // 자리가 없어 다음 학기로 넘어가는 과목
    const unlocked = [];
    for (const id of term) {
      for (const after of next.get(id)) {           // 이 과목을 선행으로 둔 과목들
        indeg.set(after, indeg.get(after) - 1);
        if (indeg.get(after) === 0) unlocked.push(after);
      }
    }
    terms.push({ term, queue: queue.slice() });
    queue = waiting.concat(unlocked);               // 같은 학기에 선행·후행을 함께 듣지 않도록 다음 학기부터
  }
  const placed = terms.reduce((s, t) => s + t.term.length, 0);
  return { terms, remaining: indeg.size, edges, hasCycle: placed < indeg.size };
}

// 화면
const boardEl = document.getElementById("board");
const infoEl = document.getElementById("info");
const planEl = document.getElementById("plan");
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const done = new Set();
const COLS = [["base", "함께 권장", "학부·공통"], ["y2", "2학년", "권장"], ["y3", "3학년", "권장"], ["y4", "4학년", "권장"]];
const buttons = new Map();

COLS.forEach(([g, title, note]) => {
  const col = document.createElement("div");
  col.className = "col";
  col.innerHTML = `<h3>${title} <span>${note}</span></h3>`;
  COURSES.filter(c => c.group === g).forEach(c => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "course";
    b.innerHTML = `${c.name}${c.req ? '<span class="req">전필</span>' : ""}`;
    b.addEventListener("click", () => { done.has(c.id) ? done.delete(c.id) : done.add(c.id); refresh(); describe(c.id); });
    b.addEventListener("mouseenter", () => describe(c.id));
    b.addEventListener("focus", () => describe(c.id));
    buttons.set(c.id, b);
    col.appendChild(b);
  });
  boardEl.appendChild(col);
});

function describe(id) {
  const c = byId.get(id);
  const pre = prereqOf(id).map(p => byId.get(p).name);
  const after = PREREQS.filter(([a]) => a === id).map(([, b]) => byId.get(b).name);
  const state = done.has(id) ? "들은 과목" : (availableNow(done).includes(id) ? "지금 들을 수 있어요" : "선행 과목이 남았어요");
  infoEl.innerHTML = `<b>${c.name}</b> (${c.group === "base" ? "학부·공통 권장" : c.year + "학년 권장"}${c.req ? ", 전공필수" : ""}) · ${state}<br>` +
    `먼저 들으면 좋은 과목: ${pre.length ? pre.join(", ") : "없음"}` + (after.length ? ` · 이어지는 과목: ${after.join(", ")}` : "");
}

function refresh() {
  const avail = new Set(availableNow(done));
  buttons.forEach((b, id) => {
    b.classList.toggle("done", done.has(id));
    b.classList.toggle("available", avail.has(id));
    b.setAttribute("aria-pressed", String(done.has(id)));
  });
}

function chip(id) {
  const c = byId.get(id);
  return `<span class="chip${c.req ? " req" : ""}">${c.name}</span>`;
}

let timers = [];
function showPlan() {
  timers.forEach(clearTimeout); timers = [];
  const cap = Number(document.getElementById("cap").value);
  const res = planSemesters(COURSES, PREREQS, done, cap);
  planEl.innerHTML = "";
  const stat = document.createElement("p");
  stat.className = "plan-stat";
  if (res.remaining === 0) { stat.textContent = "모든 과목을 들었어요. 남은 계획이 없어요."; planEl.appendChild(stat); return; }
  stat.innerHTML = `남은 과목 <b>${res.remaining}개</b> · 남은 선행 관계 <b>${res.edges}개</b> · <b>${res.terms.length}학기</b>에 배치 · ` +
    (res.hasCycle ? "선행 관계에 순환이 있어 일부를 배치하지 못했어요" : "순환 없음 확인");
  planEl.appendChild(stat);
  res.terms.forEach((t, i) => {
    const row = document.createElement("div");
    row.className = "term" + (reduceMotion ? "" : " appear");
    const waiting = t.queue.filter(id => !t.term.includes(id));
    row.innerHTML = `<div class="term-label">+${i + 1}학기</div><div><div class="chips">${t.term.map(chip).join("")}</div>` +
      `<p class="queue">이번 학기 시작 시 큐: ${t.queue.length}개` + (waiting.length ? ` · 자리가 없어 다음 학기로: ${waiting.map(id => byId.get(id).name).join(", ")}` : "") + `</p></div>`;
    const show = () => planEl.appendChild(row);
    if (reduceMotion) show(); else timers.push(setTimeout(show, i * 220));
  });
}

document.getElementById("make").addEventListener("click", showPlan);
document.getElementById("mine").addEventListener("click", () => { done.clear(); MY_COURSES.forEach(id => done.add(id)); refresh(); showPlan(); });
document.getElementById("clear").addEventListener("click", () => { done.clear(); refresh(); planEl.innerHTML = '<p class="empty">‘수강 순서 만들기’를 누르면 남은 과목이 학기별로 배치돼요.</p>'; });
refresh();



</script>
</body>
</html>
